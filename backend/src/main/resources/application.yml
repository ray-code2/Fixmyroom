spring:
  application:
    name: fmr-api
  datasource:
    url: ${FMR_DATASOURCE_URL:jdbc:h2:file:./data/fmr-phase1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${FMR_DATASOURCE_USERNAME:sa}
    password: ${FMR_DATASOURCE_PASSWORD:}
    driver-class-name: ${FMR_DATASOURCE_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  error:
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${FMR_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081}
  security:
    jwt:
      issuer: ${FMR_JWT_ISSUER:fmr-local}
      secret: ${FMR_JWT_SECRET:dev-only-change-this-secret-before-production-please}
      ttl-minutes: ${FMR_JWT_TTL_MINUTES:480}
  seed:
    enabled: ${FMR_SEED_DEMO_USERS:true}
    demo-password: ${FMR_DEMO_PASSWORD:Password123!}
  admin:
    export-key: ${FMR_EXPORT_KEY:fmr-admin-2026}
  gemini:
    api-key: ${GEMINI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: ${FMR_LOG_FILE:logs/fmr-api.log}
  level:
    root: INFO
    com.fixmyroom: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
