spring:
  application:
    name: fmr-api
  datasource:
    url: ${FMR_DATASOURCE_URL:jdbc:h2:file:./data/fmr-phase1;MODE=PostgreSQL}
    username: ${FMR_DATASOURCE_USERNAME:sa}
    password: ${FMR_DATASOURCE_PASSWORD:}
    driver-class-name: ${FMR_DATASOURCE_DRIVER:#{null}}
  sql:
    init:
      mode: never   # schema is now owned by Liquibase (see db/changelog); schema.sql is reused as the baseline only
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 33MB
  error:
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${FMR_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081}
  security:
    jwt:
      issuer: ${FMR_JWT_ISSUER:fmr-local}
      # No default here on purpose — the app must fail to start rather than silently
      # sign tokens with a known secret. Local/dev runs get a fallback from the
      # "dev" Spring profile (see application-dev.yml); every other environment
      # must set FMR_JWT_SECRET explicitly.
      secret: ${FMR_JWT_SECRET}
      ttl-minutes: ${FMR_JWT_TTL_MINUTES:480}
  seed:
    enabled: ${FMR_SEED_DEMO_USERS:true}
    demo-password: ${FMR_DEMO_PASSWORD:Password123!}
  admin:
    export-key: ${FMR_EXPORT_KEY:fmr-admin-2026}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  mail:
    from: ${MAIL_FROM:noreply@fixmyroom.app}
  base-url: ${APP_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: ${FMR_LOG_FILE:logs/fmr-api.log}
  level:
    root: INFO
    com.fixmyroom: INFO
    com.fixmyroom.email: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
